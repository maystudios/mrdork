name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment may run at a time. Let an active deployment finish
# before the next one starts so the public site is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # This repository already contains the finished static website, so there
      # is no Node/PHP build step. The action excludes repository metadata and
      # packages the site (including the custom-domain CNAME) for Pages.
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
